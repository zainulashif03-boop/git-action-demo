<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSRTC Bus Booking</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
        }

        header {
            background: #c62828;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        header span {
            font-size: 14px;
        }

        .hero {
            background: linear-gradient(
                rgba(0,0,0,0.45),
                rgba(0,0,0,0.45)
            ),
            url("https://images.unsplash.com/photo-1544620347-c4fd4a3d5957")
            center/cover;

            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .booking-box {
            background: white;
            width: 100%;
            max-width: 1000px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }

        .booking-box h2 {
            text-align: center;
            color: #c62828;
            margin-bottom: 25px;
        }

        .trip-type {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .search-btn {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background: #c62828;
            border: none;
            color: white;
            font-size: 17px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #a91f1f;
        }

        .results {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .bus-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bus-info h3 {
            color: #c62828;
            margin-bottom: 8px;
        }

        .bus-info p {
            color: #555;
            margin: 5px 0;
        }

        .book-btn {
            background: #198754;
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 5px;
            cursor: pointer;
        }

        .book-btn:hover {
            background: #146c43;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .bus-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            header {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>KSRTC</h1>
    <span>Bus Ticket Booking</span>
</header>

<section class="hero">

    <div class="booking-box">

        <h2>Book Your Bus Ticket</h2>

        <div class="trip-type">
            <label>
                <input type="radio" name="trip" value="oneway" checked>
                One Way
            </label>

            <label>
                <input type="radio" name="trip" value="round">
                Round Trip
            </label>
        </div>

        <form id="bookingForm">

            <div class="form-row">

                <div class="form-group">
                    <label>Leaving From</label>
                    <select id="from" required>
                        <option value="">Select City</option>
                        <option>Bengaluru</option>
                        <option>Mysuru</option>
                        <option>Mangaluru</option>
                        <option>Thiruvananthapuram</option>
                        <option>Kochi</option>
                        <option>Kozhikode</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Going To</label>
                    <select id="to" required>
                        <option value="">Select City</option>
                        <option>Bengaluru</option>
                        <option>Mysuru</option>
                        <option>Mangaluru</option>
                        <option>Thiruvananthapuram</option>
                        <option>Kochi</option>
                        <option>Kozhikode</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Departure Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label>Passengers</label>
                    <select id="passengers">
                        <option value="1">1 Passenger</option>
                        <option value="2">2 Passengers</option>
                        <option value="3">3 Passengers</option>
                        <option value="4">4 Passengers</option>
                        <option value="5">5 Passengers</option>
                    </select>
                </div>

            </div>

            <button type="submit" class="search-btn">
                Search Buses
            </button>

        </form>

    </div>

</section>

<section class="results" id="results"></section>

<footer>
    <p>© 2026 KSRTC Bus Booking Demo</p>
</footer>

<script>
    document.getElementById("bookingForm").addEventListener("submit", function(e) {

        e.preventDefault();

        const from = document.getElementById("from").value;
        const to = document.getElementById("to").value;
        const date = document.getElementById("date").value;
        const passengers = document.getElementById("passengers").value;

        if (from === to) {
            alert("Departure and destination cannot be the same.");
            return;
        }

        const results = document.getElementById("results");

        results.innerHTML = `
            <h2 style="margin-bottom:15px;">
                Available Buses
            </h2>

            <div class="bus-card">
                <div class="bus-info">
                    <h3>KSRTC Super Fast</h3>
                    <p><strong>${from}</strong> → <strong>${to}</strong></p>
                    <p>Departure: 08:30 AM</p>
                    <p>Passengers: ${passengers}</p>
                    <p>Fare: ₹450 per passenger</p>
                </div>

                <button class="book-btn"
                        onclick="bookBus('KSRTC Super Fast')">
                    Book Now
                </button>
            </div>

            <div class="bus-card">
                <div class="bus-info">
                    <h3>KSRTC Express</h3>
                    <p><strong>${from}</strong> → <strong>${to}</strong></p>
                    <p>Departure: 10:15 AM</p>
                    <p>Passengers: ${passengers}</p>
                    <p>Fare: ₹520 per passenger</p>
                </div>

                <button class="book-btn"
                        onclick="bookBus('KSRTC Express')">
                    Book Now
                </button>
            </div>
        `;
    });

    function bookBus(busName) {
        alert(
            "Selected Bus: " + busName +
            "\\n\\nThis is a demo booking page."
        );
    }
</script>

</body>
</html>
